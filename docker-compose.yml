services:
  postgres:
    image: postgres:16-alpine
    container_name: healthy-pets-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-healthy_pets_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthy_pets_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
