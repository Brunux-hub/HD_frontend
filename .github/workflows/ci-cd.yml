name: CI-CD Veterinaria

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Ejecutar pruebas automatizadas
        run: npm test

      - name: Construir aplicación
        run: npm run build

      - name: Simular despliegue a staging
        run: |
          mkdir -p staging
          cp -r .next staging/
          echo "Despliegue simulado completado correctamente." > staging/despliegue.txt
      - name: Guardar artefacto de staging
        uses: actions/upload-artifact@v4
        with:
          name: veterinaria-staging
          path: staging/